name: Publish ActionTrail 1.5.12

on:
  push:
    paths:
      - '.release-1512'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and metadata
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/local VERSION = "1\.5\.11"/local VERSION = "1.5.12"/' ActionTrail.lua
          python - <<'PY'
          from pathlib import Path
          p=Path('ActionTrail.lua')
          s=p.read_text(encoding='utf-8')
          old='''    local icon = b:CreateTexture(nil, "BACKGROUND")\n    icon:SetTexture("Interface\\\\AddOns\\\\ActionTrail\\\\ActionTrailIcon")\n    icon:SetSize(20, 20)\n    icon:SetPoint("CENTER", 0, 1)\n    icon:SetTexCoord(0.08, 0.92, 0.08, 0.92)\n'''
          new='''    local icon = b:CreateTexture(nil, "ARTWORK")\n    -- Use the TGA explicitly. WoW can show a solid green placeholder when an\n    -- unsupported/ambiguous texture source is selected.\n    icon:SetTexture("Interface\\\\AddOns\\\\ActionTrail\\\\ActionTrailIcon.tga")\n    icon:SetSize(22, 22)\n    icon:SetPoint("CENTER", 0, 1)\n    icon:SetTexCoord(0.06, 0.94, 0.06, 0.94)\n'''
          if old not in s:
              raise SystemExit('minimap icon block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          sed -i 's/1\.5\.11/1.5.12/g' ActionTrail.toc
          sed -i 's/ActionTrail-1\.5\.11\.zip/ActionTrail-1.5.12.zip/g; s/ActionTrail 1\.5\.11 ZIP/ActionTrail 1.5.12 ZIP/g; s/Current addon version: \*\*1\.5\.11\*\*/Current addon version: **1.5.12**/' README.md
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          entry='''## 1.5.12\n- Fixed the minimap button showing a solid green placeholder.\n- Minimap icon now explicitly loads `ActionTrailIcon.tga` on the ARTWORK layer.\n- Slightly adjusted icon size/crop; drag and click behavior unchanged.\n\n'''
          if '## 1.5.12' not in s:
              s=s.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build1512
          mkdir -p .build1512/ActionTrail dist
          cp ActionTrail.lua ActionTrail.toc ActionTrailIcon.png ActionTrailIcon.tga README.md LICENSE CHANGELOG.md .build1512/ActionTrail/
          cd .build1512
          zip -r ../dist/ActionTrail-1.5.12.zip ActionTrail >/dev/null
          cd ..
          rm -rf .build1512
      - name: Commit 1.5.12
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ActionTrail.lua ActionTrail.toc README.md CHANGELOG.md dist/ActionTrail-1.5.12.zip
          git commit -m 'Publish ActionTrail 1.5.12'
          git push
