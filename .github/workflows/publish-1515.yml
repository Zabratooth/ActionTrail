name: Publish ActionTrail 1.5.15

on:
  push:
    paths:
      - '.release-1515'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tested 1.5.15 source
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/local VERSION = "1\.5\.12"/local VERSION = "1.5.15"/' ActionTrail.lua
          python - <<'PY'
          from pathlib import Path
          p=Path('ActionTrail.lua')
          s=p.read_text(encoding='utf-8')
          old='''    local icon = b:CreateTexture(nil, "ARTWORK")\n    -- Use the TGA explicitly. WoW can show a solid green placeholder when an\n    -- unsupported/ambiguous texture source is selected.\n    icon:SetTexture("Interface\\\\AddOns\\\\ActionTrail\\\\ActionTrailIcon.tga")\n    icon:SetSize(22, 22)\n    icon:SetPoint("CENTER", 0, 1)\n    icon:SetTexCoord(0.06, 0.94, 0.06, 0.94)\n'''
          new='''    local icon = b:CreateTexture(nil, "ARTWORK")\n    -- Use the custom ActionTrail icon again, but load it in the classic WoW\n    -- style without a file extension. The bundled TGA is a simple 64x64\n    -- power-of-two texture for maximum compatibility with the Forever client.\n    icon:SetTexture("Interface\\\\AddOns\\\\ActionTrail\\\\ActionTrailIcon")\n    icon:SetSize(22, 22)\n    icon:SetPoint("CENTER", 0, 1)\n    icon:SetTexCoord(0.06, 0.94, 0.06, 0.94)\n'''
          if old not in s:
              raise SystemExit('expected 1.5.12 minimap icon block not found')
          s=s.replace(old,new,1)
          anchor='local gseHistory = {}\nlocal gseClickSerial = 0\n'
          if anchor not in s:
              raise SystemExit('GSE state anchor not found')
          s=s.replace(anchor, anchor+'local gseHookCount = 0\n', 1)
          p.write_text(s,encoding='utf-8')
          PY
          sed -i 's/1\.5\.12/1.5.15/g' ActionTrail.toc
          sed -i 's/ActionTrail-1\.5\.12\.zip/ActionTrail-1.5.15.zip/g; s/ActionTrail 1\.5\.12 ZIP/ActionTrail 1.5.15 ZIP/g; s/Current addon version: \*\*1\.5\.12\*\*/Current addon version: **1.5.15**/' README.md
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          entry='''## 1.5.15\n- Fixed `gseHookCount` initialization when GSE executors are hooked.\n- Restored the original ActionTrail minimap icon design using a WoW-compatible 64x64 TGA loaded without file extension.\n- No other functional changes.\n\n'''
          if '## 1.5.15' not in s:
              s=s.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Re-export compatible TGA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          # Keep the existing tested TGA from the source package when present.
          # The repository already contains the same ActionTrail artwork; this release
          # only needs the 64x64 uncompressed compatibility export used by 1.5.15.
          png=Path('ActionTrailIcon.png').read_bytes()
          # Use ImageMagick if available on the runner.
          PY
          if command -v convert >/dev/null 2>&1; then
            convert ActionTrailIcon.png -resize 64x64\! -compress none ActionTrailIcon.tga
          elif command -v magick >/dev/null 2>&1; then
            magick ActionTrailIcon.png -resize 64x64\! -compress none ActionTrailIcon.tga
          else
            echo 'No ImageMagick available; keeping existing TGA.'
          fi
      - name: Build addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build1515
          mkdir -p .build1515/ActionTrail dist
          cp ActionTrail.lua ActionTrail.toc ActionTrailIcon.png ActionTrailIcon.tga README.md LICENSE CHANGELOG.md .build1515/ActionTrail/
          rm -f dist/ActionTrail-1.5.15.zip
          cd .build1515
          zip -r ../dist/ActionTrail-1.5.15.zip ActionTrail >/dev/null
          cd ..
          rm -rf .build1515
      - name: Commit 1.5.15
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ActionTrail.lua ActionTrail.toc ActionTrailIcon.tga README.md CHANGELOG.md dist/ActionTrail-1.5.15.zip
          git commit -m 'Publish ActionTrail 1.5.15'
          git push
