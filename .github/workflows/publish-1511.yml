name: Publish ActionTrail 1.5.11

on:
  push:
    paths:
      - '.fix/READY-1511'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working 1.5.11 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .fix/lua1511.gz.b64 | gzip -d > ActionTrail.lua
          sed -i 's/## Title: ActionTrail 1\.5\.10/## Title: ActionTrail 1.5.11/' ActionTrail.toc
          sed -i 's/## Version: 1\.5\.10/## Version: 1.5.11/' ActionTrail.toc
          sed -i 's/ActionTrail-1\.5\.10\.zip/ActionTrail-1.5.11.zip/g; s/ActionTrail 1\.5\.10 ZIP/ActionTrail 1.5.11 ZIP/g; s/Current addon version: \*\*1\.5\.10\*\*/Current addon version: **1.5.11**/' README.md
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          entry='''# Changelog\n\n## 1.5.11\n- Fixed the corrupted Lua source/package published for 1.5.10.\n- Restored the complete working GSE executor scan.\n- No intended feature changes beyond restoring the tested 1.5.10 behavior.\n\n'''
          if s.startswith('# Changelog\n'):
              s=entry+s[len('# Changelog\n\n'):]
          else:
              s=entry+s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build WoW addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix/build
          mkdir -p .fix/build/ActionTrail dist
          cp ActionTrail.lua ActionTrail.toc ActionTrailIcon.png ActionTrailIcon.tga README.md LICENSE .fix/build/ActionTrail/
          cp CHANGELOG.md .fix/build/ActionTrail/
          rm -f dist/ActionTrail-1.5.11.zip
          cd .fix/build
          zip -r ../../dist/ActionTrail-1.5.11.zip ActionTrail >/dev/null
          cd ../..
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ActionTrail.lua ActionTrail.toc README.md CHANGELOG.md dist/ActionTrail-1.5.11.zip
          git commit -m 'Publish ActionTrail 1.5.11'
          git push
