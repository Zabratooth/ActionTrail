name: Package ActionTrail addon

on:
  push:
    paths:
      - '.package/READY'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WoW addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package/build
          mkdir -p .package/build/ActionTrail dist
          cp ActionTrail.lua .package/build/ActionTrail/
          cp ActionTrail.toc .package/build/ActionTrail/
          cp ActionTrailIcon.png .package/build/ActionTrail/
          cp ActionTrailIcon.tga .package/build/ActionTrail/
          cp README.md .package/build/ActionTrail/
          cp LICENSE .package/build/ActionTrail/
          rm -f dist/ActionTrail-1.5.10.zip
          cd .package/build
          zip -r ../../dist/ActionTrail-1.5.10.zip ActionTrail >/dev/null
          cd ../..
      - name: Commit packaged ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/ActionTrail-1.5.10.zip
          git commit -m 'Fix ActionTrail 1.5.10 WoW addon ZIP structure'
          git push
