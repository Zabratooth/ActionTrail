name: Materialize ActionTrail payload

on:
  push:
    paths:
      - '.payload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat .payload/lua.*.b64 | base64 -d > ActionTrail.lua
          cat .payload/zip.*.b64 | base64 -d > dist/ActionTrail-1.5.10.zip
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ActionTrail.lua dist/ActionTrail-1.5.10.zip
          git commit -m 'Publish ActionTrail 1.5.10 source and ZIP'
          git push
