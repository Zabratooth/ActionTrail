name: Package ActionTrail 1.5.16

on:
  push:
    paths:
      - ".release-1516b"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build addon ZIP
        run: |
          rm -rf build/ActionTrail
          mkdir -p build/ActionTrail dist
          cp ActionTrail.lua ActionTrail.toc ActionTrailIcon.png ActionTrailIcon.tga README.md LICENSE CHANGELOG.md build/ActionTrail/
          cd build
          zip -r ../dist/ActionTrail-1.5.16.zip ActionTrail
          cd ..
      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ActionTrail-1.5.16.zip
          git commit -m "Package ActionTrail 1.5.16"
          git push
